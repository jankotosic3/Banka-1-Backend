# Blackbox exporter probe modules.
# http_2xx: GET na health endpoint, uspeh = HTTP 2xx odgovor.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: []        # prazno = podrazumevano 2xx
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false
